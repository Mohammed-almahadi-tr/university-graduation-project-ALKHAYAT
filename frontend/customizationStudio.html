<!doctype html>
<html class="ui-block" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Garment Design Customization Studio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/tailwind.bundle.css" />
    <script src="./src/main.js" defer></script>
  </head>
  <body class="column-layout">
    <!-- Decorative Watermark Background -->
    <div class="absolute-element-secondary"></div>
    <!-- Header / Navigation -->
    <header class="page-header-alt">
      <div class="flex-row-custom4">
        <div class="flex-row-custom5">
          <span class="inline-text-secondary material-icons">architecture</span>
        </div>
        <h1 class="main-title">
          Tailor<span class="inline-text-primary">Studio</span>
        </h1>
      </div>
      <!-- Garment Toggle -->
      <div class="flex-row-custom6">
        <button class="btn-light">Dishdasha</button>
        <button class="btn-primary">Jellabiya</button>
      </div>
      <div class="flex-row-custom7">
        <button class="btn-secondary">
          <span class="inline-text-custom4 material-icons">help_outline</span>
        </button>
        <button class="btn-secondary">
          <span class="inline-text-custom4 material-icons">account_circle</span>
        </button>
      </div>
    </header>
    <main class="main-content-alt">
      <!-- Left: 3D Preview Canvas -->
      <section class="content-section">
        <!-- Background Decoration -->
        <div class="absolute-element-custom1">
          <div class="absolute-element-custom2"></div>
          <div class="absolute-element-custom3"></div>
        </div>
        <!-- Garment Preview Image -->
        <div class="flex-row-custom8">
          <img
            alt="Traditional Dishdasha Preview"
            class="img-block-alt"
            data-alt="Modern high quality traditional white dishdasha garment"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBj5Kk8iLD6o5GnNT3wLNAveyDkz2xEIw5bCeZHwzBuzZuusJ7i9h6pHRfgyU8qPLnrPwW_0vRbm0wyHYeks_smjp1j9nKs0Vx07oCLyPJ22gx5tiVADdkpC4-dU4elG20yp3eHkhxfpJihAlxCuY2KvzjJvfKS4SGbQOyPjI1Hy5RefIcIccqNV7cc_tC7vjlAhnAILFnPG84ovAxMWLZAvnlL0SFlR_BpW3Zb93dqeHCee-dgAp6zMKXd2YX6YPsDLcw_7OWLiW5q"
          />
          <!-- Interaction Hotspots -->
          <div class="absolute-element-custom4">
            <div class="flex-row-custom9">
              <div class="inline-text"></div>
            </div>
            <div class="absolute-element-custom5">
              Mandarin Collar Detail
            </div>
          </div>
          <div class="absolute-element-custom6">
            <div class="flex-row-custom10">
              <div class="inline-text"></div>
            </div>
          </div>
        </div>
        <!-- Preview Controls -->
        <div class="flex-row-custom11">
          <button class="btn-custom1">
            <span class="inline-text-custom4 material-icons">360</span>
          </button>
          <div class="ui-block-custom5"></div>
          <button class="btn-custom1">
            <span class="inline-text-custom4 material-icons">zoom_in</span>
          </button>
          <button class="btn-custom1">
            <span class="inline-text-custom4 material-icons">zoom_out</span>
          </button>
          <div class="ui-block-custom5"></div>
          <button class="btn-custom1">
            <span class="inline-text-custom4 material-icons">photo_camera</span>
          </button>
        </div>
      </section>
      <!-- Right: Customization Sidebar -->
      <aside class="sidebar-alt">
        <div class="ui-block-custom6">
          <!-- Section: Fabric -->
          <section>
            <div class="flex-space-between">
              <h2 class="section-title-alt">1. Select Fabric</h2>
              <span class="inline-text-custom19">Premium</span>
            </div>
            <div class="grid-layout-variant">
              <button class="btn-custom2">
                <div class="rounded-block-custom3">
                  <img
                    class="img-block-variant"
                    data-alt="Close up of white cotton texture"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKSsYNrZzIVEAsnVD59IcySQveFGiT3oiI9_rNcN__NCR1cL-hLqnNHbVx8LcdTeXdqW4jn7XPWHubitb9m1x4yf-6vMwwIlWYvTFNv2ROWdpUlZuN9MsWzqH0etXzC534UpzSdVcQtTGS3GTx0MYg1cW5jQNo0qGOGe5B2mq8qpflp9NhJAnpuxOYm_AHDcoW044y_kydgP6pqRj77APIVfBz1zqSnDxyyGAKiifooLBC1gAeeqXBd3iNdIfct6rHrtIfiVlI7KRo"
                  />
                </div>
                <p class="paragraph-custom3">Fine Cotton</p>
                <p class="paragraph-custom4">Breathable &amp; Classic</p>
                <div class="absolute-element-custom7">
                  <span class="inline-text-custom20 material-icons"
                    >check_circle</span
                  >
                </div>
              </button>
              <button class="btn-custom3">
                <div class="rounded-block-custom4">
                  <img
                    class="img-block-dark"
                    data-alt="Close up of grey linen fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXJVeM1g16EtnXH3rotS3unXFR9-6CYCUW8RnPDpFd3YZ7nGiMXmw1tViV27w2oV6AO-mqgXY8g9HFkaL3xjNnyWhEF4Tl3NQwflUy5iCjhoL_acoPofwdUt6-pimcKKhQAs5EnR9K7txaDI1Pt11NKiO5Kve1TKHnZiOQidd9c89BEzzJG4j_U2CLjt_o_5Caq6knB9w5f_44Ht9_CSpGDjHjYQ7K0PmCwy8rK0HWhpurI-xrdRGU7L4C5CJumt6119vOuPn9xS7t"
                  />
                </div>
                <p class="paragraph-custom5">Italian Linen</p>
                <p class="paragraph-custom6">Luxurious &amp; Cool</p>
              </button>
              <button class="btn-custom3">
                <div class="rounded-block-custom4">
                  <img
                    class="img-block-dark"
                    data-alt="Close up of smooth silk fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9fQXdCWPGjAXIvmiSDnkaqY6n6tQHLbpDscUjlh-69rhfENOAc28tQSdKvSpoA5FHJuK-FKVWP6A4hxL8TbA4Xmu0MSHk-NzdPioId9dKwQcN-htFyvUmrmHsXvalKRphgJI-gA16rs2_NJ-43Ygtu8ay3JJfbv39rHn4jdgNoa7VuhvttO_lOFQKVa-FieZTy9u68-jwXyXbSubxp0_9KohOSo98BVB8BTLAq8lj1f132HrzDcynVY5M72DOCbCCrAIUe7RU7Z25"
                  />
                </div>
                <p class="paragraph-custom5">Mixed Silk</p>
                <p class="paragraph-custom6">Soft &amp; Elegant</p>
              </button>
              <button class="btn-custom3">
                <div class="rounded-block-custom4">
                  <img
                    class="img-block-dark"
                    data-alt="Close up of wool fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDD0C6sGQuYmhExXQvyXHhLNTHpfMN_bYWlb1bVRkECjozDGtjkHYmSXcANBuDqRiwkfMi23b9tsts4a-rbU5aHGPUZB2HpeXcJ7ZtfUYGgVWQuRnP4_ckVH_qWD_UNPNMIu9Z5m3gRIFY8MGxBnB9b3C3BiepkIVcUorTwMc4bw6qqj5H7Km0gnNCRxV-Ox_3Hsp7tcH3dWvrjN98--Su2HjcyQzOnJgURBaLyWZOr70_nRI-4ge562VeD8lF6_0tRZxe3xc3-wyrv"
                  />
                </div>
                <p class="paragraph-custom5">Winter Wool</p>
                <p class="paragraph-custom6">Warm &amp; Durable</p>
              </button>
            </div>
          </section>
          <!-- Section: Colors -->
          <section>
            <h2 class="section-title-variant">2. Color</h2>
            <div class="flex-row-custom12">
              <button class="btn-custom4">
                <span class="inline-text-custom21">White</span>
              </button>
              <button class="btn-custom5">
                <span class="inline-text-custom22">Cream</span>
              </button>
              <button class="btn-custom6">
                <span class="inline-text-custom22">Platinum</span>
              </button>
              <button class="btn-custom7">
                <span class="inline-text-custom22">Sky</span>
              </button>
              <button class="btn-custom8">
                <span class="inline-text-custom22">Navy</span>
              </button>
            </div>
          </section>
          <!-- Section: Collar Style -->
          <section class="content-section-alt">
            <h2 class="section-title-variant">3. Collar Type</h2>
            <div class="ui-block-custom7">
              <label class="form-label">
                <input
                  checked=""
                  class="form-input-dark"
                  name="collar"
                  type="radio"
                />
                <div class="ui-block-custom8">
                  <span class="inline-text-custom23">Qatari (High Neck)</span>
                  <span class="inline-text-custom24"
                    >Formal, structured high mandarin collar</span
                  >
                </div>
              </label>
              <label class="form-label-alt">
                <input class="form-input-light" name="collar" type="radio" />
                <div class="ui-block-custom8">
                  <span class="inline-text-custom25">Sudanese Style</span>
                  <span class="inline-text-custom26"
                    >Traditional open neck with embroidery space</span
                  >
                </div>
              </label>
              <label class="form-label-alt">
                <input class="form-input-light" name="collar" type="radio" />
                <div class="ui-block-custom8">
                  <span class="inline-text-custom25">Kuwaiti (Hidden Button)</span>
                  <span class="inline-text-custom26"
                    >Modern minimalist fold-over collar</span
                  >
                </div>
              </label>
            </div>
          </section>
          <!-- Section: Sleeves & Cuffs -->
          <section>
            <h2 class="section-title-variant">4. Sleeve Style</h2>
            <div class="grid-layout-variant">
              <button class="btn-custom9">
                <span class="inline-text-custom27 material-icons"
                  >view_stream</span
                >
                <span class="inline-text-custom28">French Cuff</span>
              </button>
              <button class="btn-custom10">
                <span class="inline-text-custom29 material-icons"
                  >drag_handle</span
                >
                <span class="inline-text-custom30">Straight Open</span>
              </button>
            </div>
          </section>
          <!-- Section: Buttons -->
          <section>
            <h2 class="section-title-variant">5. Buttons</h2>
            <div class="flex-row-custom13">
              <button class="btn-custom11">Visible</button>
              <button class="btn-custom12">
                Hidden
              </button>
              <button class="btn-custom11">Studs</button>
            </div>
          </section>
        </div>
        <!-- Footer Action Bar -->
        <div class="ui-block-custom9">
          <div class="flex-space-between">
            <div>
              <p class="paragraph-custom7">Estimated Price</p>
              <p class="sub-title-alt">
                $185.00 <span class="inline-text-custom31">USD</span>
              </p>
            </div>
            <div class="ui-block-custom10">
              <p class="paragraph-custom7">Timeline</p>
              <p class="paragraph-custom5">5-7 Business Days</p>
            </div>
          </div>
          <button class="btn-custom13">
            <span class="inline-text-custom32">NEXT: MEASUREMENTS</span>
            <span class="inline-text-custom33 material-icons">chevron_right</span>
          </button>
        </div>
      </aside>
    </main>
    <!-- UI Overlay: Hotkey Info -->
    <div class="flex-row-custom14">
      <span class="inline-text-custom34"
        ><kbd class="rounded-block-custom5">R</kbd> Reset View</span
      >
      <span class="inline-text-custom34"
        ><kbd class="rounded-block-custom5">SPACE</kbd> Fullscreen</span
      >
    </div>
    <!-- Background Accents -->
    <div class="fixed-element-alt"></div>
    <div class="fixed-element-variant"></div>
  </body>
</html>
