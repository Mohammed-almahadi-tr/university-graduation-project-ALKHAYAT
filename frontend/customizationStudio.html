<!doctype html>
<html class="dark-semantic" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Garment Design Customization Studio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/tailwind.bundle.css" />
    <script src="./src/main.js" defer></script>
  </head>
  <body class="column-stack-dark">
    <!-- Decorative Watermark Background -->
    <div class="absolute-alt"></div>
    <!-- Header / Navigation -->
    <header class="header-flex-space">
      <div class="flex-row-item">
        <div class="flex-row-primary-rounded-block">
          <span class="ui-block-wrapper material-icons">architecture</span>
        </div>
        <h1 class="heading-block">
          Tailor<span class="ui-block-block">Studio</span>
        </h1>
      </div>
      <!-- Garment Toggle -->
      <div class="flex-row-primary-rounded-wrapper">
        <button class="action-btn-primary-rounded-shadowed">Dishdasha</button>
        <button class="action-btn-light-rounded">Jellabiya</button>
      </div>
      <div class="flex-row-inner">
        <button class="action-btn-alt">
          <span class="ui-block-group material-icons">help_outline</span>
        </button>
        <button class="action-btn-alt">
          <span class="ui-block-group material-icons">account_circle</span>
        </button>
      </div>
    </header>
    <main class="flex-row-layout">
      <!-- Left: 3D Preview Canvas -->
      <section class="section-flex-row">
        <!-- Background Decoration -->
        <div class="absolute-variant">
          <div class="primary-rounded-absolute-alt"></div>
          <div class="primary-rounded-absolute-variant"></div>
        </div>
        <!-- Garment Preview Image -->
        <div class="flex-row-content">
          <img
            alt="Traditional Dishdasha Preview"
            class="image-shadowed"
            data-alt="Modern high quality traditional white dishdasha garment"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBj5Kk8iLD6o5GnNT3wLNAveyDkz2xEIw5bCeZHwzBuzZuusJ7i9h6pHRfgyU8qPLnrPwW_0vRbm0wyHYeks_smjp1j9nKs0Vx07oCLyPJ22gx5tiVADdkpC4-dU4elG20yp3eHkhxfpJihAlxCuY2KvzjJvfKS4SGbQOyPjI1Hy5RefIcIccqNV7cc_tC7vjlAhnAILFnPG84ovAxMWLZAvnlL0SFlR_BpW3Zb93dqeHCee-dgAp6zMKXd2YX6YPsDLcw_7OWLiW5q"
          />
          <!-- Interaction Hotspots -->
          <div class="absolute-block">
            <div class="flex-row-primary-rounded-container">
              <div class="primary-rounded-inner"></div>
            </div>
            <div class="light-rounded-shadowed-absolute">
              Mandarin Collar Detail
            </div>
          </div>
          <div class="absolute-wrapper">
            <div class="flex-row-primary-rounded-box">
              <div class="primary-rounded-inner"></div>
            </div>
          </div>
        </div>
        <!-- Preview Controls -->
        <div class="flex-row-light-rounded-shadowed-absolute">
          <button class="action-btn-flex-row-rounded">
            <span class="ui-block-group material-icons">360</span>
          </button>
          <div class="primary-variant"></div>
          <button class="action-btn-flex-row-rounded">
            <span class="ui-block-group material-icons">zoom_in</span>
          </button>
          <button class="action-btn-flex-row-rounded">
            <span class="ui-block-group material-icons">zoom_out</span>
          </button>
          <div class="primary-variant"></div>
          <button class="action-btn-flex-row-rounded">
            <span class="ui-block-group material-icons">photo_camera</span>
          </button>
        </div>
      </section>
      <!-- Right: Customization Sidebar -->
      <aside class="column-stack-light-shadowed">
        <div class="ui-block-custom12">
          <!-- Section: Fabric -->
          <section>
            <div class="flex-space">
              <h2 class="heading-wrapper">1. Select Fabric</h2>
              <span class="primary-rounded-layout">Premium</span>
            </div>
            <div class="grid-layout-variant">
              <button class="action-btn-primary-rounded-alt">
                <div class="light-rounded-variant">
                  <img
                    class="image"
                    data-alt="Close up of white cotton texture"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKSsYNrZzIVEAsnVD59IcySQveFGiT3oiI9_rNcN__NCR1cL-hLqnNHbVx8LcdTeXdqW4jn7XPWHubitb9m1x4yf-6vMwwIlWYvTFNv2ROWdpUlZuN9MsWzqH0etXzC534UpzSdVcQtTGS3GTx0MYg1cW5jQNo0qGOGe5B2mq8qpflp9NhJAnpuxOYm_AHDcoW044y_kydgP6pqRj77APIVfBz1zqSnDxyyGAKiifooLBC1gAeeqXBd3iNdIfct6rHrtIfiVlI7KRo"
                  />
                </div>
                <p class="paragraph-item">Fine Cotton</p>
                <p class="paragraph-inner">Breathable &amp; Classic</p>
                <div class="absolute-container">
                  <span class="ui-block-custom13 material-icons"
                    >check_circle</span
                  >
                </div>
              </button>
              <button class="action-btn-light-rounded-alt">
                <div class="light-rounded-block">
                  <img
                    class="image-alt"
                    data-alt="Close up of grey linen fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXJVeM1g16EtnXH3rotS3unXFR9-6CYCUW8RnPDpFd3YZ7nGiMXmw1tViV27w2oV6AO-mqgXY8g9HFkaL3xjNnyWhEF4Tl3NQwflUy5iCjhoL_acoPofwdUt6-pimcKKhQAs5EnR9K7txaDI1Pt11NKiO5Kve1TKHnZiOQidd9c89BEzzJG4j_U2CLjt_o_5Caq6knB9w5f_44Ht9_CSpGDjHjYQ7K0PmCwy8rK0HWhpurI-xrdRGU7L4C5CJumt6119vOuPn9xS7t"
                  />
                </div>
                <p class="paragraph-layout">Italian Linen</p>
                <p class="paragraph-content">Luxurious &amp; Cool</p>
              </button>
              <button class="action-btn-light-rounded-alt">
                <div class="light-rounded-block">
                  <img
                    class="image-alt"
                    data-alt="Close up of smooth silk fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9fQXdCWPGjAXIvmiSDnkaqY6n6tQHLbpDscUjlh-69rhfENOAc28tQSdKvSpoA5FHJuK-FKVWP6A4hxL8TbA4Xmu0MSHk-NzdPioId9dKwQcN-htFyvUmrmHsXvalKRphgJI-gA16rs2_NJ-43Ygtu8ay3JJfbv39rHn4jdgNoa7VuhvttO_lOFQKVa-FieZTy9u68-jwXyXbSubxp0_9KohOSo98BVB8BTLAq8lj1f132HrzDcynVY5M72DOCbCCrAIUe7RU7Z25"
                  />
                </div>
                <p class="paragraph-layout">Mixed Silk</p>
                <p class="paragraph-content">Soft &amp; Elegant</p>
              </button>
              <button class="action-btn-light-rounded-alt">
                <div class="light-rounded-block">
                  <img
                    class="image-alt"
                    data-alt="Close up of wool fabric"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDD0C6sGQuYmhExXQvyXHhLNTHpfMN_bYWlb1bVRkECjozDGtjkHYmSXcANBuDqRiwkfMi23b9tsts4a-rbU5aHGPUZB2HpeXcJ7ZtfUYGgVWQuRnP4_ckVH_qWD_UNPNMIu9Z5m3gRIFY8MGxBnB9b3C3BiepkIVcUorTwMc4bw6qqj5H7Km0gnNCRxV-Ox_3Hsp7tcH3dWvrjN98--Su2HjcyQzOnJgURBaLyWZOr70_nRI-4ge562VeD8lF6_0tRZxe3xc3-wyrv"
                  />
                </div>
                <p class="paragraph-layout">Winter Wool</p>
                <p class="paragraph-content">Warm &amp; Durable</p>
              </button>
            </div>
          </section>
          <!-- Section: Colors -->
          <section>
            <h2 class="heading-container">2. Color</h2>
            <div class="flex-row-group">
              <button class="action-btn-light-rounded-shadowed">
                <span class="absolute-box">White</span>
              </button>
              <button class="action-btn-rounded">
                <span class="absolute-item">Cream</span>
              </button>
              <button class="action-btn-rounded-alt">
                <span class="absolute-item">Platinum</span>
              </button>
              <button class="action-btn-rounded-variant">
                <span class="absolute-item">Sky</span>
              </button>
              <button class="action-btn-rounded-block">
                <span class="absolute-item">Navy</span>
              </button>
            </div>
          </section>
          <!-- Section: Collar Style -->
          <section class="section">
            <h2 class="heading-container">3. Collar Type</h2>
            <div class="ui-block-custom14">
              <label class="flex-row-primary-rounded-item">
                <input
                  checked=""
                  class="input-field"
                  name="collar"
                  type="radio"
                />
                <div class="ui-block-custom15">
                  <span class="ui-block-custom16">Qatari (High Neck)</span>
                  <span class="ui-block-custom17"
                    >Formal, structured high mandarin collar</span
                  >
                </div>
              </label>
              <label class="flex-row-light-rounded">
                <input class="input-field-alt" name="collar" type="radio" />
                <div class="ui-block-custom15">
                  <span class="ui-block-custom18">Sudanese Style</span>
                  <span class="ui-block-custom19"
                    >Traditional open neck with embroidery space</span
                  >
                </div>
              </label>
              <label class="flex-row-light-rounded">
                <input class="input-field-alt" name="collar" type="radio" />
                <div class="ui-block-custom15">
                  <span class="ui-block-custom18">Kuwaiti (Hidden Button)</span>
                  <span class="ui-block-custom19"
                    >Modern minimalist fold-over collar</span
                  >
                </div>
              </label>
            </div>
          </section>
          <!-- Section: Sleeves & Cuffs -->
          <section>
            <h2 class="heading-container">4. Sleeve Style</h2>
            <div class="grid-layout-variant">
              <button class="action-btn-column-stack-light-rounded">
                <span class="ui-block-custom20 material-icons"
                  >view_stream</span
                >
                <span class="ui-block-custom21">French Cuff</span>
              </button>
              <button class="action-btn-column-stack-primary-rounded">
                <span class="ui-block-custom22 material-icons"
                  >drag_handle</span
                >
                <span class="ui-block-custom23">Straight Open</span>
              </button>
            </div>
          </section>
          <!-- Section: Buttons -->
          <section>
            <h2 class="heading-container">5. Buttons</h2>
            <div class="flex-row-section">
              <button class="action-btn-light-rounded-variant">Visible</button>
              <button class="action-btn-primary-rounded-shadowed-alt">
                Hidden
              </button>
              <button class="action-btn-light-rounded-variant">Studs</button>
            </div>
          </section>
        </div>
        <!-- Footer Action Bar -->
        <div class="ui-block-custom24">
          <div class="flex-space">
            <div>
              <p class="paragraph-group">Estimated Price</p>
              <p class="paragraph-section">
                $185.00 <span class="ui-block-custom25">USD</span>
              </p>
            </div>
            <div class="ui-block-custom26">
              <p class="paragraph-group">Timeline</p>
              <p class="paragraph-layout">5-7 Business Days</p>
            </div>
          </div>
          <button class="action-btn-flex-row-primary-rounded-shadowed">
            <span class="ui-block-custom27">NEXT: MEASUREMENTS</span>
            <span class="ui-block-custom28 material-icons">chevron_right</span>
          </button>
        </div>
      </aside>
    </main>
    <!-- UI Overlay: Hotkey Info -->
    <div class="flex-row-module">
      <span class="flex-row-element"
        ><kbd class="light-rounded-wrapper">R</kbd> Reset View</span
      >
      <span class="flex-row-element"
        ><kbd class="light-rounded-wrapper">SPACE</kbd> Fullscreen</span
      >
    </div>
    <!-- Background Accents -->
    <div class="rounded-wrapper"></div>
    <div class="rounded-container"></div>
  </body>
</html>
